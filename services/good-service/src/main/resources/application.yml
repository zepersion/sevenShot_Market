server:
        port: 8081

spring:
        application:
                name: goods-service
        datasource:
                url: jdbc:mysql://localhost:3306/campus_idle_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
                username: root
                password: root
                driver-class-name: com.mysql.cj.jdbc.Driver
        data:
                redis:
                        host: localhost
                        port: 6379
                        lettuce:
                                pool:
                                        max-active: 8
                                        max-idle: 8
                                        min-idle: 2
        cloud:
                nacos:
                        discovery:
                                server-addr: localhost:8848
                                namespace: public

ai:
        openai:
                api-key: dummy
        ollama:
                chat:
                        enabled: false

mybatis-plus:
        configuration:
                # 打印SQL日志
                log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
                # 开启下划线自动转驼峰（重要！）
                map-underscore-to-camel-case: true

        rabbitmq:
                host: localhost
                port: 5672
                username: guest
                password: guest
                virtual-host: /
                listener:
                                simple:
                                        prefetch:1





